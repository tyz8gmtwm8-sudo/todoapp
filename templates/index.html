<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>やることリスト</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 16px;
            color: #222;
        }
        h1 {
            margin-bottom: 8px;
        }
        .new-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: #2d7ff9;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #f5f5f5;
        }
        .content-cell {
            white-space: pre-wrap;
        }
        .edit-link {
            color: #2d7ff9;
        }
        .empty {
            color: #777;
        }
    </style>
</head>
<body>
    <h1>やることリスト</h1>
    <a class="new-button" href="{{ url_for('new_todo') }}">＋ 新しいやることを登録</a>

    {% if todos %}
    <table>
        <thead>
            <tr>
                <th>タイトル</th>
                <th>内容</th>
                <th>期日</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for todo in todos %}
            <tr>
                <td>{{ todo.title }}</td>
                <td class="content-cell">{{ todo.content }}</td>
                <td>{{ todo.due_date }}</td>
                <td><a class="edit-link" href="{{ url_for('edit_todo', todo_id=todo.id) }}">編集</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="empty">まだ登録されたやることがありません。</p>
    {% endif %}
</body>
</html>
