<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>やることリスト</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 16px;
            color: #222;
        }
        h1 {
            margin-bottom: 8px;
        }
        .new-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: #2d7ff9;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #f5f5f5;
        }
        .content-cell {
            white-space: pre-wrap;
        }
        .edit-link {
            color: #2d7ff9;
            margin-right: 12px;
        }
        .empty {
            color: #777;
        }
        tr.done .title-cell,
        tr.done .content-cell {
            text-decoration: line-through;
            color: #999;
        }
        .delete-form {
            display: inline;
        }
        .delete-btn {
            background: none;
            border: none;
            padding: 0;
            color: #d9363e;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>やることリスト</h1>
    <a class="new-button" href="{{ url_for('new_todo') }}">＋ 新しいやることを登録</a>

    {% if todos %}
    <table>
        <thead>
            <tr>
                <th>完了</th>
                <th>タイトル</th>
                <th>内容</th>
                <th>期日</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for todo in todos %}
            <tr class="{{ 'done' if todo.done == 'TRUE' else '' }}">
                <td>
                    <form class="delete-form" method="post" action="{{ url_for('toggle_todo', todo_id=todo.id) }}">
                        <input type="checkbox" onchange="this.form.submit()" {{ 'checked' if todo.done == 'TRUE' else '' }}>
                    </form>
                </td>
                <td class="title-cell">{{ todo.title }}</td>
                <td class="content-cell">{{ todo.content }}</td>
                <td>{{ todo.due_date }}</td>
                <td>
                    <a class="edit-link" href="{{ url_for('edit_todo', todo_id=todo.id) }}">編集</a>
                    <form class="delete-form" method="post" action="{{ url_for('delete_todo', todo_id=todo.id) }}" onsubmit="return confirm('「{{ todo.title }}」を削除します。よろしいですか？');">
                        <button type="submit" class="delete-btn">削除</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="empty">まだ登録されたやることがありません。</p>
    {% endif %}
</body>
</html>
